[package]
name = "burn-lm-http"
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = []
description = "Burn Large Models Engine - HTTP."
documentation = "https://docs.rs/burn-lm-http"
repository = "https://github.com/tracel-ai/burn-lm"
rust-version.workspace = true

edition.workspace = true
version.workspace = true
license.workspace = true
readme.workspace = true

[features]
# Optional in-process CPU profiler exposed over HTTP on the same port the server already
# binds (see `src/profiling.rs`). Off by default so the normal server stays lean; the
# benchmark harness turns it on to profile a deployed Modal @web_server container.
profiling = ["dep:pprof"]

[dependencies]
burn = { workspace = true }
burn-lm-inference = { path = "../burn-lm-inference", version = "0.0.1" }
burn-lm-registry = { path = "../burn-lm-registry", version = "0.0.1" }

# CPU profiler (feature = "profiling"). flamegraph -> /debug/pprof/flamegraph SVG;
# protobuf-codec -> /debug/pprof/profile pprof.pb for `pprof -http`.
pprof = { version = "0.14", default-features = false, features = ["flamegraph", "protobuf-codec"], optional = true }

async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
lazy_static = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }

[[bin]]
name = "burn-lm-http"
path = "src/bin/burn-lm-http.rs"
